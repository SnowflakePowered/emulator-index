name: update-kytyps5

on:
  schedule:
    - cron: "45 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO: KytyPS5/KytyPS5
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # KytyPS5 only publishes a release per build (KytyPS5-<date>-<sha>), so
      # only nightly is filled in, with the most recently published one. Only
      # the newest is kept.
      - name: Update nightly
        run: |
          entry=$(gh api "repos/$REPO/releases?per_page=30" | jq -c '
            [.[] | select(.draft | not)]
            | max_by(.published_at)
            | def asset($re): [.assets[] | select(.name | test($re)) | .browser_download_url] | first;
              {
                version: (.tag_name | ltrimstr("KytyPS5-")),
                assets: ({
                  "win-x64":   asset("-Windows-x64[.]zip$"),
                  "macos-x64": asset("-macOS-x86_64[.]zip$"),
                  "linux-x64": asset("-Linux-x86_64[.]tar[.]gz$")
                } | with_entries(select(.value != null)))
              }')
          ENTRY=$entry yq -i -P '.nightly = [env(ENTRY)]' kytyps5.yaml

      # adds sha256 and size to every asset (see scripts/checksums.sh)
      - name: Add checksums
        run: bash scripts/checksums.sh kytyps5.yaml

      - name: Commit changes
        run: |
          if git diff --quiet -- kytyps5.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kytyps5.yaml
          git commit -m "kytyps5: update releases"
          # several update workflows can run at once (see global-dispatch), so
          # rebase and retry if another one pushed first
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          done
          exit 1
