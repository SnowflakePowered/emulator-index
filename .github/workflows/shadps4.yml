name: update-shadps4

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO: shadps4-emu/shadPS4
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # stable  = latest release (tagged "v.X.Y.Z"); history is kept, newest
      #           first.
      # nightly = the most recently published "Pre-release-shadPS4-<date>-<sha>"
      #           release. Only the newest is kept.
      # shadPS4 has no preview channel.
      - name: Update stable and nightly
        run: |
          release_entry='
            def asset($re): [.assets[] | select(.name | test($re)) | .browser_download_url] | first;
            {
              version: $version,
              assets: ({
                "win-x64":     asset("^shadps4-win64-sdl-"),
                "macos-arm64": asset("^shadps4-macos-sdl-"),
                "linux-x64":   asset("^shadps4-linux-sdl-")
              } | with_entries(select(.value != null)))
            }'

          stable_json=$(gh api "repos/$REPO/releases/latest")
          stable=$(jq -c --arg version "$(jq -r '.tag_name | ltrimstr("v.") | ltrimstr("v")' <<<"$stable_json")" "$release_entry" <<<"$stable_json")

          nightly_json=$(gh api "repos/$REPO/releases?per_page=30" \
            | jq -c '[.[] | select(.prerelease and (.draft | not) and (.tag_name | startswith("Pre-release-")))] | max_by(.published_at)')
          nightly=$(jq -c --arg version "$(jq -r '.name | ltrimstr("Pre-release-shadPS4-")' <<<"$nightly_json")" "$release_entry" <<<"$nightly_json")

          ENTRY=$stable VER=$(jq -r .version <<<"$stable") yq -i -P '
            .stable = ([env(ENTRY)] + ((.stable // []) | map(select(.version != strenv(VER)))))
          ' shadps4.yaml
          ENTRY=$nightly yq -i -P '.nightly = [env(ENTRY)]' shadps4.yaml

      - name: Commit changes
        run: |
          if git diff --quiet -- shadps4.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadps4.yaml
          git commit -m "shadps4: update releases"
          git push
