name: update-stella

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO: stella-emu/stella
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stella only publishes tagged releases (its CI uploads no artifacts),
      # so only stable is filled in; history is kept, newest first. The only
      # Linux binary is a Debian package. There is no preview or nightly
      # channel.
      - name: Update stable
        run: |
          entry=$(gh api "repos/$REPO/releases/latest" | jq -c '
            def asset($re): [.assets[] | select(.name | test($re)) | .browser_download_url] | first;
            {
              version: .tag_name,
              assets: ({
                "win-x64":     asset("^Stella-.*-windows[.]zip$"),
                "macos-arm64": asset("^Stella-.*-macos[.]dmg$"),
                "linux-x64":   asset("^stella_[0-9.]+_amd64[.]deb$")
              } | with_entries(select(.value != null)))
            }')
          ENTRY=$entry VER=$(jq -r .version <<<"$entry") yq -i -P '
            .stable = ([env(ENTRY)] + ((.stable // []) | map(select(.version != strenv(VER)))))
          ' stella.yaml

      - name: Commit changes
        run: |
          if git diff --quiet -- stella.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stella.yaml
          git commit -m "stella: update releases"
          git push
