name: update-dosbox-staging

on:
  schedule:
    - cron: "45 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO: dosbox-staging/dosbox-staging
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # stable  = latest GitHub release; history is kept, newest first.
      # nightly = the rolling "dev-latest" release. Its version is the
      #           release name (e.g. 0.84.0-alpha-c1e7c). Only the newest is
      #           kept.
      # DOSBox Staging has no preview channel.
      - name: Update stable and nightly
        run: |
          release_entry='
            def asset($re): [.assets[] | select(.name | test($re)) | .browser_download_url] | first;
            {
              version: $version,
              assets: ({
                "win-x64":     asset("^dosbox-staging-windows-x64-.*(?<!-setup)[.]zip$"),
                "macos-arm64": asset("^dosbox-staging-macOS-.*[.]dmg$"),
                "linux-x64":   asset("^dosbox-staging-linux-x86_64-.*[.]tar[.]xz$")
              } | with_entries(select(.value != null)))
            }'

          stable_json=$(gh api "repos/$REPO/releases/latest")
          stable=$(jq -c --arg version "$(jq -r '.tag_name | ltrimstr("v")' <<<"$stable_json")" "$release_entry" <<<"$stable_json")

          nightly_json=$(gh api "repos/$REPO/releases/tags/dev-latest")
          nightly=$(jq -c --arg version "$(jq -r .name <<<"$nightly_json")" "$release_entry" <<<"$nightly_json")

          ENTRY=$stable VER=$(jq -r .version <<<"$stable") yq -i -P '
            .stable = ([env(ENTRY)] + ((.stable // []) | map(select(.version != strenv(VER)))))
          ' dosbox-staging.yaml
          ENTRY=$nightly yq -i -P '.nightly = [env(ENTRY)]' dosbox-staging.yaml

      # adds sha256 and size to every asset (see scripts/checksums.sh)
      - name: Add checksums
        run: bash scripts/checksums.sh dosbox-staging.yaml

      - name: Commit changes
        run: |
          if git diff --quiet -- dosbox-staging.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dosbox-staging.yaml
          git commit -m "dosbox-staging: update releases"
          git push
