name: update-retroarch

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILDBOT: https://buildbot.libretro.com

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Both channels come from buildbot.libretro.com.
      # stable  = highest numbered directory under /stable/; history is kept.
      # nightly = the newest dated build of each platform under /nightly/ (the
      #           dated files never change, so each URL is a fixed build). The
      #           version is the date of the Windows build. Only the newest is
      #           kept.
      # RetroArch has no preview channel.
      - name: Update stable and nightly
        run: |
          # Prints "key url" lines for the files that exist under $1 (a base URL).
          assets() {
            for spec in \
              "win-x64 windows/x86_64/RetroArch.7z" \
              "macos-arm64 apple/osx/universal/RetroArch_Metal.dmg" \
              "linux-x64 linux/x86_64/RetroArch.7z"; do
              set -- "$1" $spec
              if curl -fsIL -o /dev/null "$1/$3"; then echo "$2 $1/$3"; fi
            done
          }
          to_json() { jq -Rn '[inputs | split(" ") | {(.[0]): .[1]}] | add // {}'; }

          # stable
          version=$(curl -fsSL "$BUILDBOT/stable/" \
            | grep -oE 'href="/stable/[0-9]+[.][0-9]+[.][0-9]+/"' | grep -oE '[0-9]+[.][0-9]+[.][0-9]+' \
            | sort -V | tail -1)
          stable_assets=$(assets "$BUILDBOT/stable/$version" | to_json)
          if [ "$stable_assets" != "{}" ]; then
            entry=$(jq -nc --arg v "$version" --argjson a "$stable_assets" '{version: $v, assets: $a}')
            ENTRY=$entry VER=$version yq -i -P '
              .stable = ([env(ENTRY)] + ((.stable // []) | map(select(.version != strenv(VER)))))
            ' retroarch.yaml
          fi

          # nightly: the newest dated file of each platform. Dated files never
          # change, unlike the rolling undated ones.
          latest_dated() { # directory under /nightly/, file name suffix
            curl -fsSL "$BUILDBOT/nightly/$1/"               | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}_$2" | sort | tail -1
          }
          win=$(latest_dated windows/x86_64 'RetroArch[.]7z')
          mac=$(latest_dated apple/osx/universal 'RetroArch_Metal[.]dmg')
          linux=$(latest_dated linux/x86_64 'RetroArch[.]7z')

          nightly_assets=$(
            { [ -z "$win" ]   || echo "win-x64 $BUILDBOT/nightly/windows/x86_64/$win"
              [ -z "$mac" ]   || echo "macos-arm64 $BUILDBOT/nightly/apple/osx/universal/$mac"
              [ -z "$linux" ] || echo "linux-x64 $BUILDBOT/nightly/linux/x86_64/$linux"; } | to_json)
          if [ -n "$win" ] && [ "$nightly_assets" != "{}" ]; then
            entry=$(jq -nc --arg v "${win%%_*}" --argjson a "$nightly_assets" '{version: $v, assets: $a}')
            ENTRY=$entry yq -i -P '.nightly = [env(ENTRY)]' retroarch.yaml
          fi

      # adds sha256 and size to every asset (see scripts/checksums.sh)
      - name: Add checksums
        run: bash scripts/checksums.sh retroarch.yaml

      - name: Commit changes
        run: |
          if git diff --quiet -- retroarch.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retroarch.yaml
          git commit -m "retroarch: update releases"
          # several update workflows can run at once (see global-dispatch), so
          # rebase and retry if another one pushed first
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          done
          exit 1
