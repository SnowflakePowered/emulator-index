name: update-duckstation

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO: stenzek/duckstation
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # stable  = newest versioned release (v0.1-NNNN); history is kept.
      # preview = the rolling "latest" release.
      # nightly = the "preview" release ("Latest Preview Build").
      # The rolling releases keep a fixed tag, so their version is the short
      # sha of the commit the tag points at. Only the newest is kept.
      - name: Update stable, preview and nightly
        run: |
          release_entry='
            def asset($re): [.assets[] | select(.name | test($re)) | .browser_download_url] | first;
            {
              version: $version,
              assets: ({
                "win-x64":     asset("^duckstation-windows-x64-release[.]zip$"),
                "macos-arm64": asset("^duckstation-mac-release[.]zip$"),
                "linux-x64":   asset("^DuckStation-x64[.]AppImage$")
              } | with_entries(select(.value != null)))
            }'

          rolling_entry() { # tag
            sha=$(gh api "repos/$REPO/commits/$1" --jq .sha)
            gh api "repos/$REPO/releases/tags/$1" | jq -c --arg version "${sha:0:7}" "$release_entry"
          }

          tag=$(gh api "repos/$REPO/releases?per_page=30" \
            --jq '[.[] | select((.draft | not) and (.tag_name | test("^v[0-9]")))] | first | .tag_name')
          stable=$(gh api "repos/$REPO/releases/tags/$tag" | jq -c --arg version "$tag" "$release_entry")

          ENTRY=$stable VER=$tag yq -i -P '
            .stable = ([env(ENTRY)] + ((.stable // []) | map(select(.version != strenv(VER)))))
          ' duckstation.yaml
          ENTRY=$(rolling_entry latest) yq -i -P '.preview = [env(ENTRY)]' duckstation.yaml
          ENTRY=$(rolling_entry preview) yq -i -P '.nightly = [env(ENTRY)]' duckstation.yaml

      # adds sha256 and size to every asset (see scripts/checksums.sh)
      - name: Add checksums
        run: bash scripts/checksums.sh duckstation.yaml

      - name: Commit changes
        run: |
          if git diff --quiet -- duckstation.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add duckstation.yaml
          git commit -m "duckstation: update releases"
          git push
