name: update-bigpemu

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  PAGE: https://www.richwhitehouse.com/jaguar/index.php?content=download

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # BigPEmu is closed source and only publishes the current release on its
      # download page, so only stable is filled in (history is kept, newest
      # first). The macOS version is on the App Store, so there is no macOS
      # key. There is no preview or nightly channel.
      - name: Update stable
        run: |
          html=$(curl -fsSL "$PAGE")
          version=$(grep -oE 'Current Version: *(<[^>]+>)*[0-9.]+' <<<"$html" | grep -oE '[0-9.]+$' | head -1)
          win=$(grep -oE 'https://www[.]richwhitehouse[.]com/jaguar/builds/BigPEmu_v[0-9]+[.]zip' <<<"$html" | head -1)
          linux=$(grep -oE 'https://www[.]richwhitehouse[.]com/jaguar/builds/BigPEmu_Linux64_v[0-9]+[.]tar[.]gz' <<<"$html" | head -1)
          [ -n "$version" ] && [ -n "$win" ] || { echo "download links not found"; exit 1; }

          entry=$(jq -nc --arg v "$version" --arg win "$win" --arg linux "$linux" '
            {version: $v, assets: ({"win-x64": $win, "linux-x64": $linux} | with_entries(select(.value != "")))}')
          ENTRY=$entry VER=$version yq -i -P '
            .stable = ([env(ENTRY)] + ((.stable // []) | map(select(.version != strenv(VER)))))
          ' bigpemu.yaml

      # adds sha256 and size to every asset (see scripts/checksums.sh)
      - name: Add checksums
        run: bash scripts/checksums.sh bigpemu.yaml

      - name: Commit changes
        run: |
          if git diff --quiet -- bigpemu.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bigpemu.yaml
          git commit -m "bigpemu: update releases"
          # several update workflows can run at once (see global-dispatch), so
          # rebase and retry if another one pushed first
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          done
          exit 1
