name: update-cemu

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO: cemu-project/Cemu
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # stable  = latest GitHub release; history is kept, newest first.
      #           Its macOS build is x64 only, so it has no macos-arm64 key.
      # nightly = artifacts of the newest successful push to main (the
      #           "Build check" workflow), linked through nightly.link. Only
      #           the newest is kept.
      # Cemu has no preview channel.
      - name: Update stable
        run: |
          entry=$(gh api "repos/$REPO/releases/latest" | jq -c '
            def asset($re): [.assets[] | select(.name | test($re)) | .browser_download_url] | first;
            {
              version: (.tag_name | ltrimstr("v")),
              assets: ({
                "win-x64":   asset("-windows-x64[.]zip$"),
                "macos-x64": asset("-macos-12-x64[.]dmg$"),
                "linux-x64": asset("[.]AppImage$")
              } | with_entries(select(.value != null)))
            }')
          ENTRY=$entry VER=$(jq -r .version <<<"$entry") yq -i -P '
            .stable = ([env(ENTRY)] + ((.stable // []) | map(select(.version != strenv(VER)))))
          ' cemu.yaml

      - name: Update nightly
        run: |
          read -r run sha <<<"$(gh api "repos/$REPO/actions/workflows/build_check.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0] | select(.) | "\(.id) \(.head_sha)"')"
          [ -n "$run" ] || exit 0

          entry=$(gh api "repos/$REPO/actions/runs/$run/artifacts?per_page=100" | jq -c --arg sha "${sha:0:7}" --arg repo "$REPO" '
            [.artifacts[] | select(.expired | not)] as $a
            | def url($n): [$a[] | select(.name == $n) | "https://nightly.link/\($repo)/actions/artifacts/\(.id).zip"] | first;
              {
                version: $sha,
                assets: ({
                  "win-x64":     url("cemu-bin-windows-x64"),
                  "macos-arm64": url("cemu-bin-macos-arm64"),
                  "macos-x64":   url("cemu-bin-macos-x86_64"),
                  "linux-x64":   url("cemu-appimage-x64")
                } | with_entries(select(.value != null)))
              }')
          if [ "$(jq '.assets | length' <<<"$entry")" -gt 0 ]; then
            ENTRY=$entry yq -i -P '.nightly = [env(ENTRY)]' cemu.yaml
          fi

      - name: Commit changes
        run: |
          if git diff --quiet -- cemu.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cemu.yaml
          git commit -m "cemu: update releases"
          git push
