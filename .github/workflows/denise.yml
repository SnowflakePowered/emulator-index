name: update-denise

on:
  schedule:
    - cron: "45 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO: piciji/denise
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Denise only builds on release tags, so only stable is filled in;
      # history is kept, newest first. There is no preview or nightly channel.
      - name: Update stable
        run: |
          entry=$(gh api "repos/$REPO/releases/latest" | jq -c '
            def asset($re): [.assets[] | select(.name | test($re)) | .browser_download_url] | first;
            {
              version: (.tag_name | ltrimstr("v")),
              assets: ({
                "win-x64":     asset("^denise_win64_.*[.]zip$"),
                "macos-arm64": asset("^denise_macos_arm64_.*[.]dmg[.]bz2$"),
                "macos-x64":   asset("^denise_macos_x64_.*[.]dmg[.]bz2$"),
                "linux-x64":   asset("^denise_linux_.*[.]flatpak$")
              } | with_entries(select(.value != null)))
            }')
          ENTRY=$entry VER=$(jq -r .version <<<"$entry") yq -i -P '
            .stable = ([env(ENTRY)] + ((.stable // []) | map(select(.version != strenv(VER)))))
          ' denise.yaml

      - name: Commit changes
        run: |
          if git diff --quiet -- denise.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add denise.yaml
          git commit -m "denise: update releases"
          git push
