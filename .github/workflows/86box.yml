name: update-86box

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO: 86Box/86Box
  JENKINS: https://ci.86box.net/job/86Box
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # stable  = latest GitHub release; history is kept, newest first.
      # preview = newest prerelease (e.g. a beta), but only while it is newer
      #           than the latest stable release; otherwise empty. Only the
      #           newest is kept.
      # nightly = the last successful Jenkins build of master (the "Old
      #           Recompiler (recommended)" builds). Only the newest is kept.
      - name: Update stable and preview
        run: |
          release_entry='
            def asset($re): [.assets[] | select(.name | test($re)) | .browser_download_url] | first;
            {
              version: ($tag | ltrimstr("v")),
              assets: ({
                "win-x64":     asset("^86Box-Windows-64-"),
                "macos-arm64": asset("^86Box-macOS-"),
                "linux-x64":   asset("^86Box-Linux-x86_64-")
              } | with_entries(select(.value != null)))
            }'

          stable_json=$(gh api "repos/$REPO/releases/latest")
          stable=$(jq -c --arg tag "$(jq -r .tag_name <<<"$stable_json")" "$release_entry" <<<"$stable_json")
          ENTRY=$stable VER=$(jq -r .version <<<"$stable") yq -i -P '
            .stable = ([env(ENTRY)] + ((.stable // []) | map(select(.version != strenv(VER)))))
          ' 86box.yaml

          preview_json=$(gh api "repos/$REPO/releases?per_page=30" | jq -c --arg since "$(jq -r .published_at <<<"$stable_json")" '
            [.[] | select(.prerelease and (.draft | not) and .published_at > $since)] | max_by(.published_at) // empty')
          if [ -n "$preview_json" ]; then
            preview=$(jq -c --arg tag "$(jq -r .tag_name <<<"$preview_json")" "$release_entry" <<<"$preview_json")
            ENTRY=$preview yq -i -P '.preview = [env(ENTRY)]' 86box.yaml
          else
            yq -i -P '.preview = []' 86box.yaml
          fi

      - name: Update nightly
        run: |
          build=$(curl -fsSLg "$JENKINS/lastSuccessfulBuild/api/json?tree=number,artifacts[relativePath]")
          entry=$(jq -c --arg base "$JENKINS" '
            .number as $n
            | def url($re): [.artifacts[].relativePath | select(test($re)) | "\($base)/\($n)/artifact/\(split("/") | map(@uri) | join("/"))"] | first;
              {
                version: ($n | tostring),
                assets: ({
                  "win-x64":     url("^Old Recompiler [(]recommended[)]/Windows - x64 .*[.]zip$"),
                  "macos-arm64": url("^Old Recompiler [(]recommended[)]/macOS - Universal .*[.]zip$"),
                  "linux-x64":   url("^Old Recompiler [(]recommended[)]/Linux - x64 .*[.]AppImage$")
                } | with_entries(select(.value != null)))
              }' <<<"$build")
          if [ "$(jq '.assets | length' <<<"$entry")" -gt 0 ]; then
            ENTRY=$entry yq -i -P '.nightly = [env(ENTRY)]' 86box.yaml
          fi

      # adds sha256 and size to every asset (see scripts/checksums.sh)
      - name: Add checksums
        run: bash scripts/checksums.sh 86box.yaml

      - name: Commit changes
        run: |
          if git diff --quiet -- 86box.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 86box.yaml
          git commit -m "86box: update releases"
          # several update workflows can run at once (see global-dispatch), so
          # rebase and retry if another one pushed first
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          done
          exit 1
